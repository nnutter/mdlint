name: Build GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

# Prevent concurrent tag-release builds.
concurrency:
  group: main-build
  cancel-in-progress: false

jobs:
  draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          export VERSION="${TAG#v}"
          # shellcheck disable=SC2016
          envsubst '$VERSION $REPO' < .github/release-template.md > /tmp/release-notes.md
          gh release create '${{ github.ref_name }}' \
            --repo '${{ github.repository }}' \
            --title "Release ${{ github.ref_name }}" \
            --verify-tag \
            --draft \
            --notes-file /tmp/release-notes.md

  ####
  # Attach platform binaries to the draft GitHub release
  ####

  release-binaries:
    name: Release Binaries
    needs: draft-release
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      release: ${{ github.ref_name }}

  ####
  # Finalize the draft release
  ####

  publish-release:
    name: Publish Release
    needs: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit '${{ github.ref_name }}' --repo '${{ github.repository }}' --draft=false

  update-tap:
    name: Update Homebrew tap
    if: github.repository == 'nnutter/mdlint'
    needs: publish-release
    permissions:
      contents: read
    uses: ./.github/workflows/update-tap.yaml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
