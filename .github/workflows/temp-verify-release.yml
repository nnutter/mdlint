# TEMP: remove this file before merging.
#
# Runs the real release build on a pull request to prove the v0.4.3 failure is
# fixed. Every upload is gated off in release-binaries.yml and the caller only
# grants read access, so a run here cannot touch a GitHub Release or the
# Homebrew tap.
name: TEMP Dry Run Release Binaries

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: temp-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-binaries:
    uses: ./.github/workflows/release-binaries.yml
    with:
      release: v0.4.3-verify
      dry_run: true
